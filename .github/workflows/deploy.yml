name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require verified agent approval boundary
        env:
          APPROVAL_BOUNDARY_VERIFIED: ${{ vars.APPROVAL_BOUNDARY_VERIFIED }}
        run: |
          if [ "$APPROVAL_BOUNDARY_VERIFIED" != "true" ]; then
            echo "Set repository variable APPROVAL_BOUNDARY_VERIFIED=true only after the submitted application build proves every connected-agent edit waits for human approval."
            exit 1
          fi

  build:
    needs: publication-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

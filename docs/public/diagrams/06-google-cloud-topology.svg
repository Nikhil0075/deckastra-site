<title id="t">Sanitized Google Cloud topology</title><desc id="d">Browsers and the desktop client sign in through Identity Platform and reach Cloud Run web and API services. The API uses Cloud SQL, storage buckets and secret references, hands export work to a Cloud Run worker, and calls Vertex AI and Translation only for governed requests. GitHub Actions builds images into Artifact Registry for deployment.</desc>

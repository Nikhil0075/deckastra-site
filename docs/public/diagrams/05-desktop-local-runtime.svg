<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Desktop local runtime</title><desc id="d">Inside the Deckastra Electron process, the React renderer talks to the Electron main process over IPC and to a same-origin proxy over relative HTTP only. The main process injects a per-launch secret, supervises the FastAPI sidecar on a random loopback port, and publishes a scoped 12-hour grant to the MCP adapter that coding agents use. The sidecar owns the local SQLite workspace, files and the bundled render worker. Cloud credentials stay in the main process.</desc>

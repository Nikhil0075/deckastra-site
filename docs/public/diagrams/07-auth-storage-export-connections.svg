<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1494" width="1450" height="1494" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Authentication, storage and export</title><desc id="d">Sequence: the client signs in with the identity provider and sends an authorized request that the workspace API verifies against PostgreSQL. Media uploads use a short-lived signed URL straight to private object storage. Exports create a durable job in PostgreSQL that an isolated worker runs, writing the file and report to private storage before the client gets a short-lived private download.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.08"/></filter>
</defs>
<rect width="1450" height="1494" fill="#ffffff"/>
<rect x="30" y="150" width="1390" height="390" rx="14" fill="#f6f8fd" stroke="#dbe4f6" stroke-width="1.4"/>
<text x="50" y="178" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">OPEN A WORKSPACE</text>
<rect x="30" y="556" width="1390" height="342" rx="14" fill="#f6f8fd" stroke="#dbe4f6" stroke-width="1.4"/>
<text x="50" y="584" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">UPLOAD MEDIA</text>
<rect x="30" y="914" width="1390" height="534" rx="14" fill="#f6f8fd" stroke="#dbe4f6" stroke-width="1.4"/>
<text x="50" y="942" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">EXPORT THE CURRENT DECK</text>
<path d="M150 120 V1464" stroke="#a9bde6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="45" y="20" width="210" height="96" rx="12" fill="#ffffff" stroke="#d3ddf0" stroke-width="1.6" filter="url(#shadow)"/>
<circle cx="150" cy="52" r="20" fill="#eaf1ff"/>
<g transform="translate(138.50,40.50) scale(0.958)" fill="none" stroke="#1d4ed8" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<text x="150" y="100" font-size="17" font-weight="650" fill="#111827" text-anchor="middle">Web or desktop</text>
<path d="M380 120 V1464" stroke="#a9bde6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="275" y="20" width="210" height="96" rx="12" fill="#ffffff" stroke="#d3ddf0" stroke-width="1.6" filter="url(#shadow)"/>
<circle cx="380" cy="52" r="20" fill="#eaf1ff"/>
<g transform="translate(368.50,40.50) scale(0.958)" fill="none" stroke="#1d4ed8" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></g>
<text x="380" y="100" font-size="17" font-weight="650" fill="#111827" text-anchor="middle">Identity provider</text>
<path d="M610 120 V1464" stroke="#a9bde6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="505" y="20" width="210" height="96" rx="12" fill="#ffffff" stroke="#d3ddf0" stroke-width="1.6" filter="url(#shadow)"/>
<circle cx="610" cy="52" r="20" fill="#eaf1ff"/>
<g transform="translate(598.50,40.50) scale(0.958)" fill="none" stroke="#1d4ed8" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="1.5"/><rect x="3" y="13.5" width="18" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></g>
<text x="610" y="100" font-size="17" font-weight="650" fill="#111827" text-anchor="middle">Workspace API</text>
<path d="M840 120 V1464" stroke="#a9bde6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="735" y="20" width="210" height="96" rx="12" fill="#ffffff" stroke="#d3ddf0" stroke-width="1.6" filter="url(#shadow)"/>
<circle cx="840" cy="52" r="20" fill="#eaf1ff"/>
<g transform="translate(828.50,40.50) scale(0.958)" fill="none" stroke="#1d4ed8" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
<text x="840" y="100" font-size="17" font-weight="650" fill="#111827" text-anchor="middle">PostgreSQL</text>
<path d="M1070 120 V1464" stroke="#a9bde6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="965" y="20" width="210" height="96" rx="12" fill="#ffffff" stroke="#d3ddf0" stroke-width="1.6" filter="url(#shadow)"/>
<circle cx="1070" cy="52" r="20" fill="#eaf1ff"/>
<g transform="translate(1058.50,40.50) scale(0.958)" fill="none" stroke="#1d4ed8" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="2.5"/><path d="M4 6l2 14c.3 1.2 3 2 6 2s5.7-.8 6-2l2-14"/></g>
<text x="1070" y="100" font-size="17" font-weight="650" fill="#111827" text-anchor="middle">Object storage</text>
<path d="M1300 120 V1464" stroke="#a9bde6" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="1195" y="20" width="210" height="96" rx="12" fill="#ffffff" stroke="#d3ddf0" stroke-width="1.6" filter="url(#shadow)"/>
<circle cx="1300" cy="52" r="20" fill="#eaf1ff"/>
<g transform="translate(1288.50,40.50) scale(0.958)" fill="none" stroke="#1d4ed8" stroke-width="2.30" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></g>
<text x="1300" y="100" font-size="17" font-weight="650" fill="#111827" text-anchor="middle">Export worker</text>
<g stroke="#f6f8fd" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
<path d="M150 238.0 H376" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="265.0" y="230.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">1. Authenticate</text>
<path d="M380 286.0 H154" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="265.0" y="278.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">2. OIDC account token</text>
<path d="M150 334.0 H606" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="326.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">3. Authorized workspace request</text>
<path d="M610 368.0 h40 v18 h-34" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662" y="382.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="start">4. Verify token, membership, capability</text>
<path d="M610 430.0 H836" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725.0" y="422.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">5. Read presentation head</text>
<path d="M840 478.0 H614" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725.0" y="470.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">6. Versioned document state</text>
<path d="M610 526.0 H154" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="518.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">7. Workspace response</text>
<path d="M150 644.0 H606" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="636.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">8. Request upload grant</text>
<path d="M610 678.0 h40 v18 h-34" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="662" y="692.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="start">9. Validate type, size and quota</text>
<path d="M610 740.0 H154" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="732.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">10. Short-lived signed upload</text>
<path d="M150 788.0 H1066" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="610.0" y="780.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">11. Upload bytes directly</text>
<path d="M150 836.0 H606" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="828.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">12. Complete upload</text>
<path d="M610 884.0 H836" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725.0" y="876.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">13. Record asset metadata, ownership</text>
<path d="M150 1002.0 H606" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="994.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">14. Save, export pinned version</text>
<path d="M610 1050.0 H836" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725.0" y="1042.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">15. Create durable export job</text>
<path d="M610 1098.0 H1296" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="955.0" y="1090.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">16. Dispatch isolated work</text>
<path d="M1300 1146.0 H844" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1070.0" y="1138.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">17. Load pinned document and job</text>
<path d="M1300 1194.0 H1074" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1185.0" y="1186.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">18. Read private assets</text>
<path d="M1300 1228.0 h-40 v18 h34" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1248" y="1242.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="end">19. Build scene and target file</text>
<path d="M1300 1290.0 H1074" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1185.0" y="1282.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">20. Write private export</text>
<path d="M1300 1338.0 H844" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1070.0" y="1330.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">21. Store result and report</text>
<path d="M150 1386.0 H606" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="1378.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">22. Poll or receive task status</text>
<path d="M610 1434.0 H154" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<text x="380.0" y="1426.0" font-size="15.5" font-weight="400" fill="#334155" text-anchor="middle">23. Short-lived private download</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Scaling, failure and cost controls</title><desc id="d">Interactive API traffic, heavy exports and paid AI requests each go to their own compute boundary: API revisions, an export worker running one job per instance, and a provider gateway. Durable state lives in PostgreSQL and private object storage. Release, job, spend, recovery and telemetry controls are applied at those boundaries. These are configured controls; live operational proof is separate.</desc>

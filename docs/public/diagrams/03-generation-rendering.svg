<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Generation and deterministic rendering</title><desc id="d">A brief, template or draft goes to a model or deterministic planner, which writes a structured story plan. After an outline review, the deterministic composer produces a validated .mydeck document, resolved into an IntermediateScene that drives the editable canvas, presenting, previews, and the PDF and PowerPoint adapters with degradation reports. The model proposes meaning; code owns coordinates, timing and validation.</desc>
